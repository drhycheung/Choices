<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choices · 文字交互式分支叙事模拟器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="app-header">
    <span class="brand">Choices</span>
    <span class="brand-sub">文字交互式分支叙事模拟器</span>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main id="app">
    <section id="stage">
      <h1 id="scenario-title"></h1>
      <p id="scenario-theme" class="muted"></p>
      <div id="dims" class="dims"></div>
      <div id="bilingual" class="bilingual"></div>
    </section>

    <aside id="trace-panel" class="trace-panel hidden">
      <h2>决策轨迹</h2>
      <p class="muted">每一步选择如何改变风险，因果链一目了然。</p>
      <ol id="trace-list"></ol>
    </aside>
  </main>

  <section id="ending" class="ending hidden"></section>

  <footer id="app-footer" class="muted">
    核心引擎通用 · 场景为独立 JSON 数据包 · 纯静态站：可部署 GitHub Pages，亦可双击本地打开
  </footer>

  <!-- 内嵌场景：用于直接双击打开本 HTML（file:// 协议下浏览器禁止 fetch 本地 JSON）。
       注：此块是 scenarios/student-startup.json 的副本，用于离线单文件运行；
       在静态服务器/GitHub Pages 上运行时仍以 scenarios/*.json 为准，改场景请同时同步此处。 -->
  <script type="application/json" id="embedded-scenario">
{
  "id": "student-startup",
  "title": { "zh": "学生创业：风险抉择", "en": "Student Startup: Risky Choices" },
  "theme": { "zh": "国家安全 / 法律 / 伦理", "en": "National Security / Law / Ethics" },
  "description": "首个示范场景。玩家是一名大学生创业者，在融资、数据、知识产权等环节持续做出抉择，每个选择确定性地改变国家安全、法律、伦理三类风险，最终触发对应结局。反思内容可选，教师可在课堂上补充。",
  "dimensions": {
    "national_security": { "label": { "zh": "国家安全风险", "en": "National Security Risk" }, "initial": 0, "min": 0, "max": 10, "higherIsRisk": true },
    "legal": { "label": { "zh": "法律合规风险", "en": "Legal Compliance Risk" }, "initial": 0, "min": 0, "max": 10, "higherIsRisk": true },
    "ethics": { "label": { "zh": "伦理风险", "en": "Ethics Risk" }, "initial": 0, "min": 0, "max": 10, "higherIsRisk": true }
  },
  "start": "intro",
  "nodes": {
    "intro": {
      "text": {
        "zh": "你是一名大学生，和同学开发了一款基于自研算法的数据处理工具，准备创业。产品刚有点起色，各种“机会”和风险也找上门来。你的每一个决定，都会改变公司面临的国家安全、法律与伦理风险。",
        "en": "You are a university student who, with classmates, built a data-processing tool on a self-developed algorithm and are preparing to start a business. Just as the product gains traction, various 'opportunities' and risks come knocking. Every decision you make changes the company's national-security, legal, and ethical risk."
      },
      "choices": [
        { "text": { "zh": "开始创业旅程", "en": "Begin the startup journey" }, "next": "overseas_contact" }
      ]
    },
    "overseas_contact": {
      "text": {
        "zh": "一位自称来自海外机构的联系人欣赏你们的技术，希望“深入合作”，并索要核心算法源码以评估投资价值。",
        "en": "A contact who claims to represent an overseas organization admires your technology, wants to 'cooperate deeply', and asks for the core algorithm source code to evaluate its investment value."
      },
      "choices": [
        { "text": { "zh": "拒绝提供源码，只分享已公开的论文与技术白皮书", "en": "Decline to share source; only offer published papers and technical whitepapers" }, "next": "data_usage", "effects": {} },
        { "text": { "zh": "先签署保密协议(NDA)，再提供脱敏的算法示例", "en": "Sign an NDA first, then share a sanitized algorithm sample" }, "next": "data_usage", "effects": { "national_security": 1 } },
        { "text": { "zh": "为尽快拿到投资，直接发送核心算法完整源码", "en": "Send the full core algorithm source directly to secure investment faster" }, "next": "data_usage", "effects": { "national_security": 3 } }
      ]
    },
    "data_usage": {
      "text": {
        "zh": "训练模型需要大量数据。你们还在起步，买不起合规数据授权。",
        "en": "Training the model needs large amounts of data. You are still early-stage and cannot afford licensed compliant data."
      },
      "choices": [
        { "text": { "zh": "使用公开数据集 + 自采合规样本", "en": "Use public datasets + self-collected compliant samples" }, "next": "ip_protect", "effects": {} },
        { "text": { "zh": "从黑市购买来路不明的用户数据包", "en": "Buy user-data packages of unclear origin from the black market" }, "next": "ip_protect", "effects": { "legal": 2, "ethics": 3 } },
        { "text": { "zh": "爬取竞品平台的用户数据", "en": "Scrape user data from competitor platforms" }, "next": "ip_protect", "effects": { "legal": 1, "ethics": 1 } }
      ]
    },
    "ip_protect": {
      "text": {
        "zh": "算法很有价值，但你们还没做任何知识产权保护。",
        "en": "The algorithm is valuable, but you have not yet secured any intellectual-property protection."
      },
      "choices": [
        { "text": { "zh": "尽快申请专利 / 软件著作权", "en": "File a patent / software copyright promptly" }, "next": "funding", "effects": {} },
        { "text": { "zh": "先上线抢市场，保护“以后再说”", "en": "Launch first to grab the market; 'protect it later'" }, "next": "funding", "effects": { "legal": 2 } }
      ]
    },
    "funding": {
      "text": {
        "zh": "你们需要资金扩大团队。",
        "en": "You need capital to grow the team."
      },
      "choices": [
        { "text": { "zh": "接受国内正规孵化器 / 天使投资", "en": "Take domestic accredited incubator / angel investment" }, "next": "outcome", "effects": {} },
        { "text": { "zh": "接受身份不明的境外基金注资", "en": "Accept funding from an overseas fund of unclear identity" }, "next": "outcome", "effects": { "national_security": 2, "legal": 1 } },
        { "text": { "zh": "面向学生群体众筹", "en": "Crowdfund among the student community" }, "next": "outcome", "effects": { "ethics": 2 } }
      ]
    },
    "outcome": {
      "text": {
        "zh": "一年过去了，是时候看看当初的那些选择，把公司带向了哪里。",
        "en": "A year has passed. It is time to see where those early choices led the company."
      },
      "choices": []
    }
  },
  "endings": {
    "fail_ns": {
      "title": { "zh": "技术外泄危机", "en": "Technology Leak Crisis" },
      "type": "fail",
      "condition": { "national_security": ">=5" },
      "text": {
        "zh": "核心算法流入境外不明机构，可能涉及关键技术违规外流。公司被立案调查，创业戛然而止。",
        "en": "The core algorithm reached an unclear overseas entity, possibly involving unlawful outflow of critical technology. The company is investigated and the startup halts abruptly."
      },
      "reflection": {
        "zh": "在涉及自研核心技术时，哪些信息可以向境外合作方披露？保密协议是否足以覆盖国家安全红线？",
        "en": "When it comes to self-developed core technology, what information may be disclosed to overseas partners? Does an NDA fully cover the national-security red line?"
      }
    },
    "fail_legal": {
      "title": { "zh": "法律纠纷缠身", "en": "Entangled in Legal Disputes" },
      "type": "fail",
      "condition": { "legal": ">=5" },
      "text": {
        "zh": "来路不明的数据与缺失的知识产权，让公司接连陷入侵权与违规诉讼，难以为继。",
        "en": "Data of unclear origin and missing IP protection drag the company into repeated infringement and compliance lawsuits, making it unsustainable."
      },
      "reflection": {
        "zh": "创业早期的数据来源与知识产权布局，为什么是法律合规的底线？",
        "en": "Why are early-stage data sourcing and IP strategy the baseline of legal compliance?"
      }
    },
    "fail_ethics": {
      "title": { "zh": "伦理争议爆发", "en": "Ethics Controversy Erupts" },
      "type": "fail",
      "condition": { "ethics": ">=5" },
      "text": {
        "zh": "未经同意使用用户数据的行为被曝光，公众信任崩塌，品牌一夜归零。",
        "en": "Using user data without consent is exposed; public trust collapses and the brand is wiped out overnight."
      },
      "reflection": {
        "zh": "在“增长优先”的诱惑下，如何守住对数据主体最基本的伦理尊重？",
        "en": "Amid the lure of 'growth first', how do you uphold basic ethical respect for data subjects?"
      }
    },
    "success": {
      "title": { "zh": "合规创业典范", "en": "Model of Compliant Startup" },
      "type": "success",
      "condition": { "national_security": "<=1", "legal": "<=1", "ethics": "<=1" },
      "text": {
        "zh": "你守住了对技术、法律和伦理的敬畏：核心技术受控、数据来源合规、知识产权清晰。公司在稳健中成长。",
        "en": "You upheld respect for technology, law, and ethics: core tech controlled, data sourced compliantly, IP clear. The company grows steadily."
      },
      "reflection": {
        "zh": "回顾全程，哪些“慢一步”的决定，反而成了最稳健的优势？",
        "en": "Looking back, which 'one step slower' decisions turned out to be the steadiest advantages?"
      }
    },
    "compromise": {
      "title": { "zh": "在灰色地带挣扎", "en": "Struggling in the Grey Zone" },
      "type": "compromise",
      "condition": {},
      "text": {
        "zh": "你没有被立即反噬，却也埋下了隐患。公司在模糊地带前行，随时可能因一次检查或一次曝光而失控。",
        "en": "You were not immediately punished, yet hazards were planted. The company moves through ambiguous territory, ready to spiral out of control at any inspection or exposure."
      },
      "reflection": {
        "zh": "“暂时没出事”等于“没问题”吗？灰色地带的风险会以什么形式迟早显现？",
        "en": "Does 'no incident yet' mean 'no problem'? In what form will grey-zone risk eventually surface?"
      }
    }
  }
}
  </script>

  <script src="engine.js"></script>
  <script src="validate.js"></script>
  <script src="player.js"></script>
</body>
</html>
