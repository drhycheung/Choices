<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">How the dual-track engine works</text>
  <text x="360" y="55" text-anchor="middle" font-size="13" fill="#6b7280">One deterministic pipeline · two scoreboards · nine endings, all reachable.</text>

  <!-- pipeline nodes -->
  <!-- 1 choice -->
  <rect x="15" y="92" width="105" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="67" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">Player choice</text>
  <text x="67" y="136" text-anchor="middle" font-size="10.5" fill="#4338ca">what to do next</text>

  <!-- arrow -->
  <path d="M122 123 L138 123" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 apply effects -->
  <rect x="142" y="92" width="118" height="62" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="201" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">Apply effects</text>
  <text x="201" y="134" text-anchor="middle" font-size="10.5" fill="#0e7490">explicit ± numbers</text>

  <!-- arrow -->
  <path d="M262 123 L278 123" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 state -->
  <rect x="282" y="78" width="150" height="90" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="357" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">STATE (6 dims)</text>
  <line x1="357" y1="106" x2="357" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <text x="292" y="118" font-size="10.5" font-weight="700" fill="#dc2626">RISK</text>
  <text x="292" y="133" font-size="10" fill="#374151">national security</text>
  <text x="292" y="147" font-size="10" fill="#374151">legal</text>
  <text x="292" y="161" font-size="10" fill="#374151">ethics</text>
  <text x="368" y="118" font-size="10.5" font-weight="700" fill="#16a34a">VENTURE</text>
  <text x="368" y="133" font-size="10" fill="#374151">problem–fit</text>
  <text x="368" y="147" font-size="10" fill="#374151">business</text>
  <text x="368" y="161" font-size="10" fill="#374151">moat</text>

  <!-- arrow -->
  <path d="M434 123 L450 123" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 gate -->
  <rect x="454" y="92" width="105" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="506" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Gate check</text>
  <text x="506" y="136" text-anchor="middle" font-size="10.5" fill="#c2410c">requirements?</text>

  <!-- arrow -->
  <path d="M561 123 L577 123" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 ending -->
  <rect x="581" y="92" width="124" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="643" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Ending +</text>
  <text x="643" y="134" text-anchor="middle" font-size="10.5" fill="#6d28d9">debrief (why)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- three design-rule callouts -->
  <!-- card 1 -->
  <rect x="15" y="200" width="222" height="240" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="126" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">1 · No randomness in play</text>
  <line x1="30" y1="238" x2="222" y2="238" stroke="#bae6fd" stroke-width="1"/>
  <text x="30" y="262" font-size="11.5" fill="#374151">
    <tspan x="30" dy="0">Every effect is an explicit</tspan>
    <tspan x="30" dy="16">number; the same choice</tspan>
    <tspan x="30" dy="16">sequence always yields the</tspan>
    <tspan x="30" dy="16">same ending, so a teacher</tspan>
    <tspan x="30" dy="16">can ask “at which exact</tspan>
    <tspan x="30" dy="16">step did this become</tspan>
    <tspan x="30" dy="16">unavoidable?” — and there</tspan>
    <tspan x="30" dy="16">is a true answer.</tspan>
    <tspan x="30" dy="16" font-weight="700" fill="#0e7490">Randomness</tspan>
    <tspan x="30" dy="16" font-weight="700" fill="#0e7490">appears only once:</tspan>
    <tspan x="30" dy="16" font-weight="700" fill="#0e7490">to draw the venture.</tspan>
  </text>

  <!-- card 2 -->
  <rect x="249" y="200" width="222" height="240" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="360" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">2 · Good options can be</text>
  <text x="360" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">unaffordable</text>
  <line x1="264" y1="256" x2="456" y2="256" stroke="#fed7aa" stroke-width="1"/>
  <text x="264" y="280" font-size="11.5" fill="#374151">
    <tspan x="264" dy="0">An independent compliance</tspan>
    <tspan x="264" dy="16">audit carries a requirements</tspan>
    <tspan x="264" dy="16">gate (business ≥ 7). If you</tspan>
    <tspan x="264" dy="16">never built commercial</tspan>
    <tspan x="264" dy="16">strength, the responsible</tspan>
    <tspan x="264" dy="16">path stays locked — with a</tspan>
    <tspan x="264" dy="16">hint explaining why. That</tspan>
    <tspan x="264" dy="16">lock is the lesson: doing</tspan>
    <tspan x="264" dy="16">the right thing must be</tspan>
    <tspan x="264" dy="16">affordable.</tspan>
  </text>

  <!-- card 3 -->
  <rect x="483" y="200" width="222" height="240" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="594" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">3 · Every number is</text>
  <text x="594" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">explained</text>
  <line x1="498" y1="256" x2="690" y2="256" stroke="#bbf7d0" stroke-width="1"/>
  <text x="498" y="280" font-size="11.5" fill="#374151">
    <tspan x="498" dy="0">Each choice carries a `why`</tspan>
    <tspan x="498" dy="16">note; each ending carries a</tspan>
    <tspan x="498" dy="16">debrief that attributes every</tspan>
    <tspan x="498" dy="16">score to the exact step that</tspan>
    <tspan x="498" dy="16">moved it — naming the risk</tspan>
    <tspan x="498" dy="16">lines pushed up and, box</tspan>
    <tspan x="498" dy="16">by box, which Lean Canvas</tspan>
    <tspan x="498" dy="16">blocks shifted. Students</tspan>
    <tspan x="498" dy="16">finish with a draft outline</tspan>
    <tspan x="498" dy="16">for the reflective essay.</tspan>
  </text>
</svg>
