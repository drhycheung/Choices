<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1080" height="610" fill="#ffffff"/>

  <!-- top node -->
  <rect x="360" y="58" width="360" height="86" rx="14" fill="#eaf2fd" stroke="#8fb3e8"/>
  <text x="540" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">Every choice</text>
  <text x="540" y="121" text-anchor="middle" font-size="14" fill="#3b82f6">one set of effects, written into both tracks</text>

  <!-- branch arrows -->
  <path d="M505 147 C 430 168 355 178 318 190" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M575 147 C 650 168 725 178 762 190" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- risk track card -->
  <rect x="95" y="196" width="435" height="246" rx="16" fill="#fbeaea" stroke="#f0c9c9"/>
  <text x="120" y="233" font-size="18" font-weight="700" fill="#8c2f39">Risk track · lower is better</text>
  <text x="120" y="259" font-size="14" fill="#c0392b">national_security / legal / ethics</text>
  <rect x="140" y="278" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="312" y="302" text-anchor="middle" font-size="15" fill="#374151">National security</text>
  <rect x="140" y="326" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="312" y="350" text-anchor="middle" font-size="15" fill="#374151">Legal compliance</text>
  <rect x="140" y="374" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="312" y="398" text-anchor="middle" font-size="15" fill="#374151">Ethics</text>

  <!-- venture track card -->
  <rect x="550" y="196" width="435" height="246" rx="16" fill="#dff0e8" stroke="#c2e2d1"/>
  <text x="575" y="233" font-size="18" font-weight="700" fill="#1d6b4f">Venture track · higher is better</text>
  <text x="575" y="259" font-size="14" fill="#2e8b64">the three Lean Canvas considerations</text>
  <rect x="595" y="278" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="767" y="302" text-anchor="middle" font-size="15" fill="#374151">Problem–solution fit · Canvas 1–4</text>
  <rect x="595" y="326" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="767" y="350" text-anchor="middle" font-size="15" fill="#374151">Business model · Canvas 5–7</text>
  <rect x="595" y="374" width="345" height="38" rx="8" fill="#f4f4f2" stroke="#e4e4e1"/>
  <text x="767" y="398" text-anchor="middle" font-size="15" fill="#374151">Moat &amp; metrics · Canvas 8–9</text>

  <!-- down arrows -->
  <path d="M312 446 L312 474" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M768 446 L768 474" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- bottom bar -->
  <rect x="90" y="482" width="900" height="64" rx="12" fill="#f2f2f2" stroke="#e6e6e6"/>
  <text x="540" y="520" text-anchor="middle" font-size="16" fill="#374151">Endings are gated jointly by both score sets · low risk ≠ a good company, high growth ≠ a good ending</text>
</svg>
