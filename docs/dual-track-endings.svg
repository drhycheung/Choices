<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">The Two-Track Outcome Space</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Every ending is gated by both tracks at once — risk exposure × venture strength.</text>
  <text x="670" y="72" text-anchor="end" font-size="11" fill="#6b7280">9 shared endings · all reachable (validator-proved)</text>

  <!-- quadrant tints -->
  <rect x="130" y="80" width="540" height="175" fill="#f0fdf4"/>
  <rect x="130" y="255" width="540" height="175" fill="#fef2f2"/>

  <!-- axis lines -->
  <line x1="400" y1="80" x2="400" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="130" y1="255" x2="670" y2="255" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- quadrant headers (faint) -->
  <text x="535" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a" opacity="0.20">SUSTAINABLE</text>
  <text x="265" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309" opacity="0.20">CLEAN BUT STUCK</text>
  <text x="535" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626" opacity="0.22">BOOM, THEN BUST</text>
  <text x="265" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#7f1d1d" opacity="0.20">DOUBLE LOSS</text>

  <!-- Y axis (risk) -->
  <line x1="108" y1="430" x2="108" y2="80" stroke="#374151" stroke-width="1.5"/>
  <path d="M104 88 L108 78 L112 88 Z" fill="#374151"/>
  <text x="60" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" transform="rotate(-90 60 258)">RISK EXPOSURE</text>
  <text x="100" y="92" text-anchor="end" font-size="11" fill="#16a34a">low</text>
  <text x="100" y="428" text-anchor="end" font-size="11" fill="#dc2626">high</text>

  <!-- X axis (venture) -->
  <line x1="130" y1="452" x2="670" y2="452" stroke="#374151" stroke-width="1.5"/>
  <path d="M662 448 L672 452 L662 456 Z" fill="#374151"/>
  <text x="400" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">VENTURE STRENGTH  (weak → strong)</text>

  <!-- ending chips: top-right (sustainable) -->
  <rect x="455" y="95" width="190" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="465" y="116" font-size="12" fill="#111827"><tspan font-weight="700" fill="#16a34a">win_clean</tspan> — clean victory</text>
  <rect x="455" y="137" width="190" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="465" y="158" font-size="12" fill="#111827"><tspan font-weight="700" fill="#16a34a">win_resilient</tspan> — scarred, alive</text>

  <!-- top-left (stalled) -->
  <rect x="160" y="110" width="190" height="34" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="170" y="131" font-size="12" fill="#111827"><tspan font-weight="700" fill="#b45309">stalled</tspan> — clean, but stuck</text>

  <!-- bottom-right (boom) -->
  <rect x="455" y="300" width="190" height="30" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="319" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#dc2626">boom</tspan> · national security</text>
  <rect x="455" y="336" width="190" height="30" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="355" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#dc2626">boom</tspan> · legal</text>
  <rect x="455" y="372" width="190" height="30" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="391" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#dc2626">boom</tspan> · ethics</text>

  <!-- bottom-left (bust) -->
  <rect x="145" y="300" width="190" height="30" rx="8" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="155" y="319" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#7f1d1d">bust</tspan> · national security</text>
  <rect x="145" y="336" width="190" height="30" rx="8" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="155" y="355" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#7f1d1d">bust</tspan> · legal</text>
  <rect x="145" y="372" width="190" height="30" rx="8" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="155" y="391" font-size="11.5" fill="#111827"><tspan font-weight="700" fill="#7f1d1d">bust</tspan> · ethics</text>
</svg>
